# MyBizGate site configuration (copy to site.config.yml).
# The slug is the permanent identity: repository, local folder and hosting directory
# are derived from it and never change when the domain changes.
client:
  name: Paw Haven Cat Hotel
  slug: pawhaven

template:
  id: pet-boarding/modern-01   # templates/<business-type>/<template>/ in the workspace, or "blank"
  version: null                # copied from the template's template.yml when it has one
  # Older configs use "type: petgate" (a demo name); that form is still accepted.

platform_ref: v1.2.0       # MyBizGate platform release this site's workflow is pinned to
                           # (change with: mybizgate platform-ref <slug> --set vX.Y.Z --apply)

domain:
  type: subdomain          # subdomain | custom
  primary: pawhaven.mybizgate.com
  # For custom domains:
  # type: custom
  # primary: pawhaven.com.my
  # staging: stg-pawhaven.mybizgate.com
  # dns_mode: external     # awedns | external

business:                  # collected by the wizard; fills the template tokens ({{BUSINESS_NAME}}, {{WHATSAPP}}, ...)
  whatsapp: "+60123456789" # E.164; local Malaysian numbers are normalised with a notice
  email: hello@pawhaven.com
  address: 12 Jalan Ampang, 55100 Kuala Lumpur
  # short_name: Paw Haven  # menus / WhatsApp greetings (derived from the name when omitted)
  # locality: Kuala Lumpur # area shown on the site (derived from the address when omitted)
  # seo_title: ...         # override the template's default <title>
  # seo_description: ...   # override the template's default meta description
  # phone: 03-1234 5678
  # opening_hours: Mon-Sun 9am-7pm
  # facebook: https://facebook.com/pawhaven
  # instagram: "@pawhaven"
  # tiktok: "@pawhaven"

hosting:
  deploy_dir: public_html/clients/pawhaven/   # clients: public_html/clients/<slug>/ only
  ftp_account: dedicated   # dedicated (restricted FTP user) | shared

site:
  kind: client             # client | demo | corporate
  environment: production  # production | staging
  production_url: https://pawhaven.mybizgate.com
  identity: Paw Haven Cat Hotel   # text expected on the homepage during health checks

# Local machine paths (e.g. the client photos folder given to the wizard) are NOT stored here.
# They live in .mybizgate.local.yml next to this file, which is gitignored and never built or deployed.

build:
  exclude: []              # extra paths to leave out of dist/
  images:
    convert: true
    quality: 82
    max_width: 1920
    png: lossy             # lossy | lossless
    preserve: []           # e.g. ["assets/print/*.png"]
  cache_bust: true         # replaces __BUILD_VERSION__ in dist/ only (the build-version <meta> is always added to dist HTML)

qa:
  lighthouse: false        # warning-mode Lighthouse in CI
  browser_smoke: false     # Playwright smoke tests in CI
  screenshots: false       # desktop-home.png / mobile-home.png artifacts

github:
  repo: client-pawhaven
  visibility: private
